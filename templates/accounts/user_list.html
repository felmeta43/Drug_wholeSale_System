{% extends 'base.html' %}
{% block title %}Users - MediWholesale{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item active">Users</li>{% endblock %}
{% block content %}
<div class="page-header">
    <div class="d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="bi bi-people me-2 text-primary"></i>System Users</h4>
        <a href="{% url 'user_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add User</a>
    </div>
</div>
<!-- Search -->
<div class="card table-card mb-4">
    <div class="card-body">
        <form method="get" class="row g-3 live-search-form" data-target="userResultsContainer">
            <div class="col-md-6">
                <input type="text" name="search" class="form-control" placeholder="Search by name or username..." value="{{ request.GET.search }}">
            </div>
            <div class="col-md-3">
                <select name="role" class="form-select">
                    <option value="">All Roles</option>
                    {% for val, label in roles %}
                    <option value="{{ val }}" {% if request.GET.role == val %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search me-1"></i>Search</button>
            </div>
        </form>
    </div>
</div>
<div id="userResultsContainer">
    {% include 'accounts/_user_results.html' %}
</div>
{% endblock %}
