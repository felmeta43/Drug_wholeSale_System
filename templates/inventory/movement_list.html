{% extends 'base.html' %}
{% block title %}Stock Movements - MediWholesale{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item active">Movements</li>{% endblock %}
{% block content %}
<div class="page-header">
    <h4 class="mb-0"><i class="bi bi-arrow-left-right me-2 text-primary"></i>Stock Movements</h4>
</div>
<div class="card table-card mb-4">
    <div class="card-body">
        <form method="get" class="row g-3 live-search-form" data-target="movementResultsContainer">
            <div class="col-md-5">
                <input type="text" name="search" class="form-control" placeholder="Search product or reference..." value="{{ request.GET.search }}">
            </div>
            <div class="col-md-3">
                <select name="type" class="form-select">
                    <option value="">All Types</option>
                    {% for val, label in movement_types %}
                    <option value="{{ val }}" {% if request.GET.type == val %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Filter</button>
            </div>
        </form>
    </div>
</div>
<div id="movementResultsContainer">
    {% include 'inventory/_movement_results.html' %}
</div>
{% endblock %}
