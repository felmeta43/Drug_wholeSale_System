{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Upload Document - MediWholesale{% endblock %}
{% block content %}
<div class="page-header">
    <h4 class="mb-0"><i class="bi bi-upload me-2 text-primary"></i>Upload Document for {{ customer.name }}</h4>
</div>
<div class="card table-card" style="max-width:500px;">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% crispy form %}
        </form>
    </div>
</div>
{% endblock %}
