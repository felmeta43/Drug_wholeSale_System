{% extends 'base.html' %}
{% block title %}Medicines - MediWholesale{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item active">Medicines</li>{% endblock %}
{% block content %}
<div class="page-header">
    <div class="d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="bi bi-capsule me-2 text-success"></i>Medicine Directory</h4>
        <a href="{% url 'medicine_create' %}" class="btn btn-success"><i class="bi bi-plus-lg me-1"></i>Add Medicine Info</a>
    </div>
</div>
<div class="card table-card mb-4">
    <div class="card-body">
        <form method="get" class="row g-3 live-search-form" data-target="medicineResultsContainer">
            <div class="col-md-5">
                <input type="text" name="search" class="form-control" placeholder="Search by generic name, brand, drug code..." value="{{ request.GET.search }}">
            </div>
            <div class="col-md-3">
                <select name="dosage_form" class="form-select">
                    <option value="">All Dosage Forms</option>
                    {% for val, label in dosage_forms %}
                    <option value="{{ val }}" {% if request.GET.dosage_form == val %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search me-1"></i>Search</button>
            </div>
        </form>
    </div>
</div>
<div id="medicineResultsContainer">
    {% include 'products/_medicine_results.html' %}
</div>
{% endblock %}
