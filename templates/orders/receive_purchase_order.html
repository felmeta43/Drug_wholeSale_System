{% extends 'base.html' %}
{% block title %}Receive PO - MediWholesale{% endblock %}
{% block content %}
<div class="page-header">
    <h4 class="mb-0"><i class="bi bi-box-arrow-in-down me-2 text-success"></i>Receive Items - {{ order.po_number }}</h4>
</div>
<form method="post">
    {% csrf_token %}
    <div class="card table-card mb-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead class="table-light">
                        <tr><th>Product</th><th>Ordered Qty</th><th>Received Qty</th></tr>
                    </thead>
                    <tbody>
                        {% for item in items %}
                        <tr>
                            <td>{{ item.product_variant }}</td>
                            <td>{{ item.quantity }}</td>
                            <td><input type="number" name="received_{{ item.pk }}" class="form-control form-control-sm" style="width:100px;" value="{{ item.quantity }}" min="0" max="{{ item.quantity }}"></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i>Confirm Receipt</button>
    <a href="{% url 'purchase_order_detail' order.pk %}" class="btn btn-outline-secondary ms-2">Cancel</a>
</form>
{% endblock %}
