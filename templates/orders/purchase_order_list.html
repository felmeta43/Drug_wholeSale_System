{% extends 'base.html' %}
{% block title %}Purchase Orders - MediWholesale{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item active">Purchase Orders</li>{% endblock %}
{% block content %}
<div class="page-header">
    <div class="d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="bi bi-cart-plus me-2 text-primary"></i>Purchase Orders</h4>
        <a href="{% url 'purchase_order_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Create PO</a>
    </div>
</div>
<div class="card table-card mb-4">
    <div class="card-body">
        <form method="get" class="row g-3 live-search-form" data-target="purchaseOrderResultsContainer">
            <div class="col-md-5">
                <input type="text" name="search" class="form-control" placeholder="Search PO # or supplier..." value="{{ request.GET.search }}">
            </div>
            <div class="col-md-3">
                <select name="status" class="form-select">
                    <option value="">All Statuses</option>
                    {% for val, label in status_choices %}
                    <option value="{{ val }}" {% if request.GET.status == val %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i></button>
            </div>
        </form>
    </div>
</div>
<div id="purchaseOrderResultsContainer">
    {% include 'orders/_purchase_order_results.html' %}
</div>
{% endblock %}
